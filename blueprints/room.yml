title: Meeting Room
columns:
  main:
    fields:
      noticetoggle:
        width: 1/4
        label: Page Notice Toggle
        type: toggle
      notice:
        width: 3/4
        type: text
        maxlength: 180
        when:
          noticetoggle: true
      emptynotice:
        width: 3/4
        type: gap
        when:
          noticetoggle: false
      orhours:
        label: Special Hours
        type: structure
        fields:
          ordate:
            label: Date Occurs
            type: date
          orclose:
            label: Closing Hour
            mobile: true
            type: time
            display: h:mm a
          oropen:
            label: Opening Hour
            mobile: true
            type: time
            display: h:mm a
          ormessage:
            label: Message
            type: text
            maxlength: 32
  settings:
    fields:
      pgcolor:
        width: 1/4
        label: Page Style 4 Shade Black & White / Color
        type: toggle
        text:
          - "4 Shade Black & White"
          - "color"
      emptycolortoggle:
        width: 3/4
        type: gap
        when:
          pgcolor: false
      aagprimary:
        width: 1/4
        label: Primary Color
        type: color
        options: 
          type: query
          query: kirby.option('salinapl.aag-rooms.colors')
        when:
          pgcolor: true
      aagsecondary:
        width: 1/4
        label: Secondary Color
        type: color
        options: 
          type: query
          query: kirby.option('salinapl.aag-rooms.colors')
        when:
          pgcolor: true
      aagstatus:
        width: 1/4
        label: Status Color
        type: color
        options: 
          type: query
          query: kirby.option('salinapl.aag-rooms.colors')
        when:
          pgcolor: true
      emptycolor:
        width: 1/4
        type: gap
        when:
          pgcolor: true
      aagprimaryfont:
        width: 1/4
        label: Primary Font Color
        type: color
        options: 
          type: query
          query: kirby.option('salinapl.aag-rooms.colors')
        when:
          pgcolor: true
      aagsecondaryfont:
        width: 1/4
        label: Secondary Font Color
        type: color
        options: 
          type: query
          query: kirby.option('salinapl.aag-rooms.colors')
        when:
          pgcolor: true
      aagstatusfont:
        width: 1/4
        label: Status Font Color
        type: color
        options: 
          type: query
          query: kirby.option('salinapl.aag-rooms.colors')
        when:
          pgcolor: true
      pgtouch:
        width: 1/4
        label: Reservation Mode Toggle
        type: toggle
        text:
          - "QR Code"
          - "Button"
      pgbutton:
        width: 3/4
        label: Reservation link (QR/Button)
        type: url
      pgbuttoninfo:
        label: 
        type: info
        text: |
          Button Color only applies when set to color mode.
        when:
          pgtouch: true
      aagbuttonfont:
        width: 1/2
        label: Button Font Color
        type: color
        options: 
          type: query
          query: kirby.option('salinapl.aag-rooms.colors')
        when:
          pgtouch: true
      aagbuttonbg:
        width: 1/2
        label: Button Color
        type: color
        options: 
          type: query
          query: kirby.option('salinapl.aag-rooms.colors')
        when:
          pgtouch: true
      description:
        width: 2/2
        label: Room Description
        type: textarea
  orconfig:
    fields:
      line:
        type: line
      pgconfig:
        label: Initial configuration Overrrides
        type: info
        text: |
          The following settings are just for inital configuration, don't change them unless something is broken.   
      orfeedurltoggle:
        width: 1/4
        label: Override Calendar Feed URL
        type: toggle
      feedurl:
        width: 3/4
        label: Calendar Feed URL
        type: url
        when:
          orfeedurltoggle: true
      feedflags:
        label: Library Calendar Feed Flags
        type: text
      orauthurltoggle:
        width: 1/4
        label: Override Calendar API URL
        type: toggle
      authurl:
        width: 3/4
        label: Calendar API URL
        type: url
        when:
          orauthurltoggle: true
