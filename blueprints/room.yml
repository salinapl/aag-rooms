title: Meeting Room
columns:
  main:
    fields:
      noticetoggle:
        width: 1/4
        label: Page Notice Toggle
        type: toggle
      notice:
        width: 3/4
        type: text
        maxlength: 180
        when:
          noticetoggle: true
      emptynotice:
        width: 3/4
        type: gap
        when:
          noticetoggle: false
      orhours:
        label: Special Hours
        type: structure
        fields:
          ordate:
            label: Date Occurs
            type: date
          orclose:
            label: Closing Hour
            mobile: true
            type: time
            display: h:mm a
          oropen:
            label: Opening Hour
            mobile: true
            type: time
            display: h:mm a
          ormessage:
            label: Message
            type: text
            maxlength: 32
  settings:
    fields:
      pgcolor:
        width: 1/4
        label: Page Style Colors
        type: select
        default: 2bit
        required: true
        options:
          1bit: 1-Bit Black & White
          2bit: 2-Bit 4 Grays
          color: Full Color
      emptycolor1bit:
        width: 3/4
        type: gap
        when:
          pgcolor: 1bit
      emptycolor2bit:
        width: 3/4
        type: gap
        when:
          pgcolor: 2bit
      aagprimary:
        width: 1/4
        label: Primary Color
        type: color
        required: true
        default: "#00bef2"
        when:
          pgcolor: color
      aagsecondary:
        width: 1/4
        label: Secondary Color
        type: color
        required: true
        default: "#004d71"
        when:
          pgcolor: color
      aagstatus:
        width: 1/4
        label: Status Color
        type: color
        required: true
        default: "#ffc46c"
        when:
          pgcolor: color
      emptycolor:
        width: 1/4
        type: gap
        when:
          pgcolor: color
      aagprimaryfont:
        width: 1/4
        label: Primary Font Color
        type: color
        required: true
        default: "#2e2926"
        when:
          pgcolor: color
      aagsecondaryfont:
        width: 1/4
        label: Secondary Font Color
        type: color
        required: true
        default: "#fafafa"
        when:
          pgcolor: color
      aagstatusfont:
        width: 1/4
        label: Status Font Color
        type: color
        required: true
        default: "#2e2926"
        when:
          pgcolor: color
      pgtouch:
        width: 1/4
        label: Reservation Mode Toggle (QR/Button)
        type: toggle
        text:
          - "QR Code"
          - "Button"
      qrdescription:
        width: 2/2
        label: QR Lead Text
        type: textarea
        when:
          pgtouch: false
      pgbutton:
        width: 3/4
        label: Reservation link (QR/Button)
        type: url
      pgbuttoninfo:
        label: 
        type: info
        text: |
          Button Color only applies when set to Full Color mode.
        when:
          pgtouch: true
      aagbuttonfont:
        width: 1/2
        label: Button Font Color
        type: color
        required: true
        default: "#2e2926"
        when:
          pgtouch: true
      aagbuttonbg:
        width: 1/2
        label: Button Color
        type: color
        required: true
        default: "#00bef2"
        when:
          pgtouch: true
      description:
        width: 2/2
        label: Room Description
        type: textarea
  orconfig:
    fields:
      line:
        type: line
      pgconfig:
        label: Initial configuration Overrrides
        type: info
        text: |
          The following settings are just for inital configuration, don't change them unless something is broken.   
      orfeedurltoggle:
        width: 1/4
        label: Override Calendar Feed URL
        type: toggle
      feedurl:
        width: 3/4
        label: Calendar Feed URL
        type: url
        when:
          orfeedurltoggle: true
      feedflags:
        label: Library Calendar Feed Flags
        type: text
      orauthurltoggle:
        width: 1/4
        label: Override Calendar API URL
        type: toggle
      authurl:
        width: 3/4
        label: Calendar API URL
        type: url
        when:
          orauthurltoggle: true
